name: Bug report
description: Something is broken or behaves wrongly
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Add screenshots if they help.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or image tag, for example v0.3.0.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output from the backend, worker, or browser console. Remove secrets first.
      render: shell
