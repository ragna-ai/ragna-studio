name: CI

# No workflow-level paths-ignore: a skipped workflow leaves required checks pending.
# Jobs skipped by `if:` count as passing, so docs-only PRs skip at the job level.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No turbo cache: a cache hit restores packages/*/dist without running the build
      # script, so pnpm never syncs the injected copies consumers resolve through.
      # Build first: check-types resolves workspace packages through their dist/ types.
      - run: pnpm build
      # TODO: web is excluded because `nuxt typecheck` is slow; re-add behind a path-gated job.
      - run: pnpm check-types --filter='!@repo/web'
      - run: pnpm lint

  api-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Dummy values only. The tests fake every external provider, and .env.testing
    # (loaded by NODE_ENV=test) supplies DB_DATABASE. Leave ALLOWED_LOGIN_EMAILS unset.
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      ENCRYPTION_PASSWORD: ci-only-encryption-password
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      # Same no-turbo-cache reasoning as the ci job: build through pnpm so injected copies sync.
      - run: pnpm turbo run build --filter=@repo/api...
      - run: pnpm test:setup
      # Not `pnpm test:api`: turbo's strict env mode strips the DB_* vars from its tasks.
      - run: pnpm --filter @repo/api test
