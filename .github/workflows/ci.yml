name: CI

# No workflow-level paths-ignore: a skipped workflow leaves required checks pending.
# Jobs skipped by `if:` count as passing, so docs-only PRs skip at the job level.
on:
  pull_request:
    # ready_for_review starts the run when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # Drafts skip CI; every other job needs this one, so they skip too.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      api: ${{ steps.detect.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Turbo maps changed files to packages and their dependents. It ignores root
      # files outside any package, so those that affect CI force a full run.
      - id: detect
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          # Each step fails the job on error: an empty result would silently skip CI.
          turbo_version=$(jq -r .devDependencies.turbo package.json)
          turbo_result=$(npx --yes "turbo@$turbo_version" query affected --packages --base "$BASE" --head HEAD)
          package_names=$(echo "$turbo_result" | jq -re '.data.affectedPackages.items[].name')
          affected=$(echo "$package_names" | grep -vxE '//|@repo/docs' || true)

          root_changed=false
          if git diff --name-only "$BASE...HEAD" |
            grep -qxE 'package\.json|pnpm-workspace\.yaml|turbo\.json|\.npmrc|\.oxfmtrc\.json|\.prettierignore|\.env\.testing|\.github/workflows/ci\.yml'; then
            root_changed=true
          fi

          code=false
          api=false
          if [ "$root_changed" = true ] || [ -n "$affected" ]; then code=true; fi
          if [ "$root_changed" = true ] || echo "$affected" | grep -qx '@repo/api'; then api=true; fi

          echo "Affected packages: ${affected:-none}, root files changed: $root_changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"

  build-and-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # No turbo cache: a cache hit restores packages/*/dist without running the build
      # script, so pnpm never syncs the injected copies consumers resolve through.
      # Build first: check-types resolves workspace packages through their dist/ types.
      # Docs are built and previewed by Cloudflare Workers Builds, not here.
      - run: pnpm build --filter='!@repo/docs'
      - run: pnpm check-types
      - run: pnpm lint
      - run: pnpm format --check
      # Comments state the reason themselves instead of pointing into specs/, which
      # drift. Allowlisted: pointers to long write-ups a comment can't summarize.
      - name: No spec references in code
        run: |
          if git grep -n 'specs/' -- '*.ts' '*.vue' '*.js' '*.mjs' '*Dockerfile' \
            ':!scripts/specs-index.mjs' \
            ':!apps/docs' \
            ':!apps/api/test/preload.ts' \
            ':!packages/testing/src/mocks/linkedin-provider.mock.ts' \
            ':!packages/database/src/utils/sort-order.ts'; then
            echo "::error::Code references specs/. State the reason in the comment instead."
            exit 1
          fi

  api-tests:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Dummy values only. The tests fake every external provider, and .env.testing
    # (loaded by NODE_ENV=test) supplies DB_DATABASE. Leave ALLOWED_LOGIN_EMAILS unset.
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      ENCRYPTION_PASSWORD: ci-only-encryption-password
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: pnpm install --frozen-lockfile

      # Same no-turbo-cache reasoning as the build-and-check job: build through pnpm so injected copies sync.
      - run: pnpm turbo run build --filter=@repo/api...
      - run: pnpm test:setup
      # Not `pnpm test:api`: turbo's strict env mode strips the DB_* vars from its tasks.
      - run: pnpm --filter @repo/api test
