name: ragna_studio

volumes:
  postgres_data:
  redis_data:

services:
  webapp:
    image: ghcr.io/ragna-ai/ragna-studio-webapp:latest
    container_name: ragna_studio_webapp
    restart: always
    depends_on:
      - api
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

  worker:
    image: ghcr.io/ragna-ai/ragna-studio-worker:latest
    container_name: ragna_studio_worker
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

  api:
    image: ghcr.io/ragna-ai/ragna-studio-api:latest
    container_name: ragna_studio_api
    restart: always
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

  postgres:
    image: postgres:18.4-alpine3.24
    container_name: ragna_studio_postgresql
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    security_opt:
      - no-new-privileges:true
    ports:
      - ${DB_PORT:-5432}:5432
    networks:
      - app_net

  redis:
    image: redis:8.8.0-alpine3.23
    container_name: ragna_studio_redis
    restart: always
    command: "redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    ports:
      - ${REDIS_PORT:-6379}:6379
    networks:
      - app_net

networks:
  app_net:
    name: ragna_studio_network
    driver: bridge
