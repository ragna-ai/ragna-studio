name: ragna_studio

volumes:
  postgres_data:
  redis_data:

services:
  migrate:
    image: ghcr.io/ragna-ai/ragna-studio-migrate:latest
    container_name: ragna_studio_migrate
    restart: "no"
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net
    depends_on:
      - postgres

  webapp:
    image: ghcr.io/ragna-ai/ragna-studio-webapp:latest
    container_name: ragna_studio_webapp
    restart: always
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net
    depends_on:
      - api

  worker:
    image: ghcr.io/ragna-ai/ragna-studio-worker:latest
    container_name: ragna_studio_worker
    restart: always
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  api:
    image: ghcr.io/ragna-ai/ragna-studio-api:latest
    container_name: ragna_studio_api
    restart: always
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      webbrowser:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  webbrowser:
    image: ghcr.io/ragna-ai/ragna-studio-webbrowser:latest
    container_name: ragna_studio_webbrowser
    restart: always
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: ragna_studio_postgresql
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

  redis:
    image: redis:8.8.0-alpine3.23
    container_name: ragna_studio_redis
    restart: always
    command: "redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

networks:
  app_net:
    name: ragna_studio_network
    driver: bridge
