packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  msgpackr-extract: true
  sharp: true
  vue-demi: true

catalog:
  '@tailwindcss/postcss': ^4.3.0
  '@types/node': 24.1.0
  tailwindcss: ^4.3.2
  tsdown: ^0.22.4
  typescript: 6.0.3
  zod: 4.4.3
  oxfmt: ^0.58.0
  oxlint: ^1.73.0

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.4'
  - '@turbo/darwin-arm64@2.10.4'
  - '@turbo/gen@2.10.4'
  - '@turbo/linux-64@2.10.4'
  - '@turbo/linux-arm64@2.10.4'
  - '@turbo/windows-64@2.10.4'
  - '@turbo/windows-arm64@2.10.4'
  - turbo@2.10.4

updateConfig:
  ignoreDependencies:
    - '@types/node'
