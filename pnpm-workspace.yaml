packages:
  - 'apps/*'
  - 'packages/*'

# Required for `pnpm deploy` (used by the app Dockerfiles) to materialize
# @repo/* workspace packages as real files inside the deploy target instead
# of symlinking back to the monorepo source tree, which doesn't survive
# being copied alone into a Docker runner stage.
injectWorkspacePackages: true

# drizzle-kit resolves `drizzle-orm/_relations` from its own subtree but declares
# no drizzle-orm dependency, so pnpm otherwise links the hoisted 0.45.2 (pulled in
# by db0/nuxt/better-auth) which lacks that subpath. Pin the matching RC here.
packageExtensions:
  drizzle-kit:
    dependencies:
      drizzle-orm: 1.0.0-rc.4

minimumReleaseAgeExclude:
  - 'nuxt'
  - '@nuxt/*'
  - '@ai-sdk/*'
  - '@firecrawl/*'
  - 'ai*'

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  msgpackr-extract: true
  puppeteer: true
  sharp: true
  vue-demi: true

catalog:
  '@tailwindcss/postcss': ^4.3.0
  '@types/node': 24.1.0
  tailwindcss: ^4.3.3
  tsdown: ^0.22.14
  typescript: 6.0.3
  zod: 4.4.3
  oxfmt: ^0.62.0
  oxlint: ^1.77.0
  ai: ^7.0.56

updateConfig:
  ignoreDependencies:
    - '@types/node'
    - 'typescript'
