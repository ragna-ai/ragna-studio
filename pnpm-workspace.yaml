packages:
  - 'apps/*'
  - 'packages/*'

# drizzle-kit resolves `drizzle-orm/_relations` from its own subtree but declares
# no drizzle-orm dependency, so pnpm otherwise links the hoisted 0.45.2 (pulled in
# by db0/nuxt/better-auth) which lacks that subpath. Pin the matching RC here.
packageExtensions:
  drizzle-kit:
    dependencies:
      drizzle-orm: 1.0.0-rc.4

minimumReleaseAgeExclude:
  - 'nuxt'
  - '@nuxt/kit@4.5.0 || 4.5.1 || 4.5.2'
  - '@nuxt/nitro-server@4.5.0 || 4.5.1 || 4.5.2'
  - '@nuxt/schema@4.5.0 || 4.5.1 || 4.5.2'
  - '@nuxt/vite-builder@4.5.0 || 4.5.1 || 4.5.2'
  - '@firecrawl/anydoc-darwin-arm64@0.1.3'
  - '@firecrawl/anydoc-darwin-x64@0.1.3'
  - '@firecrawl/anydoc-linux-arm64-gnu@0.1.3'
  - '@firecrawl/anydoc-linux-arm64-musl@0.1.3'
  - '@firecrawl/anydoc-linux-x64-gnu@0.1.3'
  - '@firecrawl/anydoc-linux-x64-musl@0.1.3'
  - '@firecrawl/anydoc-win32-x64-msvc@0.1.3'
  - '@firecrawl/anydoc@0.1.3'
  - '@ai-sdk/black-forest-labs@2.0.22'
  - '@ai-sdk/provider-utils@5.0.21'

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  msgpackr-extract: true
  puppeteer: true
  sharp: true
  vue-demi: true

catalog:
  '@tailwindcss/postcss': ^4.3.0
  '@types/node': 24.1.0
  tailwindcss: ^4.3.3
  tsdown: ^0.22.14
  typescript: 6.0.3
  zod: 4.4.3
  oxfmt: ^0.62.0
  oxlint: ^1.77.0
  ai: ^7.0.51

updateConfig:
  ignoreDependencies:
    - '@types/node'
    - 'typescript'
