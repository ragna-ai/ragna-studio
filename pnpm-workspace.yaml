packages:
  - 'apps/*'
  - 'packages/*'

# drizzle-kit resolves `drizzle-orm/_relations` from its own subtree but declares
# no drizzle-orm dependency, so pnpm otherwise links the hoisted 0.45.2 (pulled in
# by db0/nuxt/better-auth) which lacks that subpath. Pin the matching RC here.
packageExtensions:
  drizzle-kit:
    dependencies:
      drizzle-orm: 1.0.0-rc.4

# yuku-parser@0.6.8 dropped the runtime `walk` export that rolldown-plugin-dts
# (tsdown's dts plugin) imports, while still satisfying its ^0.6.3 range; 0.6.9
# restored it. Keep resolution off the one broken version.
overrides:
  yuku-parser: ^0.6.9

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  msgpackr-extract: true
  sharp: true
  vue-demi: true

catalog:
  '@tailwindcss/postcss': ^4.3.0
  '@types/node': 24.1.0
  tailwindcss: ^4.3.3
  tsdown: ^0.22.9
  typescript: 6.0.3
  zod: 4.4.3
  oxfmt: ^0.59.0
  oxlint: ^1.74.0
  ai: ^7.0.31

updateConfig:
  ignoreDependencies:
    - '@types/node'
    - 'typescript'

minimumReleaseAgeExclude:
  - '@yuku-parser/binding-darwin-arm64@0.6.9'
  - '@yuku-parser/binding-darwin-x64@0.6.9'
  - '@yuku-parser/binding-freebsd-x64@0.6.9'
  - '@yuku-parser/binding-linux-arm-gnu@0.6.9'
  - '@yuku-parser/binding-linux-arm-musl@0.6.9'
  - '@yuku-parser/binding-linux-arm64-gnu@0.6.9'
  - '@yuku-parser/binding-linux-arm64-musl@0.6.9'
  - '@yuku-parser/binding-linux-x64-gnu@0.6.9'
  - '@yuku-parser/binding-linux-x64-musl@0.6.9'
  - '@yuku-parser/binding-win32-arm64@0.6.9'
  - '@yuku-parser/binding-win32-x64@0.6.9'
  - yuku-parser@0.6.9
