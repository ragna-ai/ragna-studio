packages:
  - 'apps/*'
  - 'packages/*'

# drizzle-kit resolves `drizzle-orm/_relations` from its own subtree but declares
# no drizzle-orm dependency, so pnpm otherwise links the hoisted 0.45.2 (pulled in
# by db0/nuxt/better-auth) which lacks that subpath. Pin the matching RC here.
packageExtensions:
  drizzle-kit:
    dependencies:
      drizzle-orm: 1.0.0-rc.4

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  msgpackr-extract: true
  sharp: true
  vue-demi: true

catalog:
  '@tailwindcss/postcss': ^4.3.0
  '@types/node': 24.1.0
  tailwindcss: ^4.3.2
  tsdown: ^0.22.5
  typescript: 6.0.3
  zod: 4.4.3
  oxfmt: ^0.58.0
  oxlint: ^1.73.0
  ai: ^7.0.22

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.4'
  - '@turbo/darwin-arm64@2.10.4'
  - '@turbo/gen@2.10.4'
  - '@turbo/linux-64@2.10.4'
  - '@turbo/linux-arm64@2.10.4'
  - '@turbo/windows-64@2.10.4'
  - '@turbo/windows-arm64@2.10.4'
  - turbo@2.10.4
  - '@nuxtjs/i18n@10.4.1'

updateConfig:
  ignoreDependencies:
    - '@types/node'
