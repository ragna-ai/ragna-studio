packages:
  - 'apps/*'
  - 'packages/*'

# Required for `pnpm deploy` (used by the app Dockerfiles) to materialize
# @repo/* workspace packages as real files inside the deploy target instead
# of symlinking back to the monorepo source tree, which doesn't survive
# being copied alone into a Docker runner stage.
injectWorkspacePackages: true

# Injection means consumers resolve @repo/* through frozen copies under
# node_modules/.pnpm/ that nothing refreshes on rebuild. This re-syncs a
# package's injected copies whenever its `build` script runs through pnpm,
# keeping the edit-then-rebuild workflow correct. See
# specs/docker-deploy/injected-workspace-packages.md.
syncInjectedDepsAfterScripts:
  - build

# Keeps pnpm-lock.yaml a single YAML document. GitHub's dependency graph only
# reads the first document, so pnpm 12's leading env document hides every
# locked package from Dependabot (dependabot/dependabot-core#15904).
# CI and the Dockerfiles install the pnpm version from `packageManager`.
pmOnFail: ignore

# 3 days, kept equal to minimumReleaseAge in .github/renovate.json5. For an urgent
# security fix, add its exact version (never a name pattern) to minimumReleaseAgeExclude
# and remove it once it's older than 3 days.
minimumReleaseAge: 4320

# astro2tsx pins @emnapi/core 1.x but leaves @emnapi/runtime as a peer; without this pnpm
# picks the 2.0 beta that rolldown brings in, and `astro check` crashes on the mismatch.
packageExtensions:
  '@astrojs/astro2tsx':
    dependencies:
      '@emnapi/runtime': 1.11.3

allowBuilds:
  '@parcel/watcher': false
  better-sqlite3: true
  esbuild: false
  workerd: false
  msgpackr-extract: true
  puppeteer: true
  sharp: true
  vue-demi: true

catalog:
  '@tailwindcss/postcss': ^4.3.0
  '@types/node': 26.6.6
  tailwindcss: ^4.3.5
  tsdown: ^0.23.7
  typescript: 6.0.3
  zod: 4.6.7
  oxfmt: ^0.78.0
  oxlint: ^1.93.0
  ai: ^7.0.169
  mdream: 2.1.0
  oauth4webapi: 3.8.8

updateConfig:
  ignoreDependencies:
    - '@types/node'
    - 'typescript'
    # v2 needs upstream fixes before we can move
    - 'vue-stream-markdown'
