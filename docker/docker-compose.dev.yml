# This is a development override file for docker-compose.

# Own project and network name, so `down -v` on a self-host test install on the
# same machine can't delete the dev volumes, and vice versa. See
# docs/docker-deploy/dev-project-name.md.
name: ragna_studio_dev

services:
  postgres:
    cpus: 1
    restart: no
    ports:
      - ${DB_PORT:-5432}:5432

  redis:
    cpus: 1
    restart: no
    ports:
      - ${REDIS_PORT:-6379}:6379

networks:
  app_net:
    name: ragna_studio_dev_network
