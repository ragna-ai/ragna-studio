# This is a development override file for docker-compose.

services:
  migrate:
    cpus: 1
    profiles:
      - full
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432

  seed:
    cpus: 1
    profiles:
      - full
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432

  frontend:
    cpus: 1
    restart: no
    profiles:
      - full
    environment:
      - "NUXT_SECURITY_HEADERS_CONTENT_SECURITY_POLICY_CONNECT_SRC=${NUXT_SECURITY_HEADERS_CONTENT_SECURITY_POLICY_CONNECT_SRC:-'self' http://localhost:3010 ws://localhost:3010}"
      - "NUXT_SECURITY_HEADERS_CONTENT_SECURITY_POLICY_IMG_SRC=${NUXT_SECURITY_HEADERS_CONTENT_SECURITY_POLICY_IMG_SRC:-'self' data: blob: https://static.ragna.io https://images.ragna.io}"
    ports:
      - ${APP_PORT:-3000}:3000

  backend:
    cpus: 1
    restart: no
    profiles:
      - full
    environment:
      - LOG_LEVEL=warn
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WEBBROWSER_BASE_URL=http://webbrowser:3011
    ports:
      - ${API_PORT:-3010}:3010

  worker:
    cpus: 1
    restart: no
    profiles:
      - full
    environment:
      - LOG_LEVEL=warn
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SMTP_HOST=host.docker.internal

  webbrowser:
    cpus: 1
    restart: no
    profiles:
      - full
    ports:
      - ${WEBBROWSER_PORT:-3011}:3011

  postgres:
    cpus: 1
    restart: no
    ports:
      - ${DB_PORT:-5432}:5432

  redis:
    cpus: 1
    restart: no
    ports:
      - ${REDIS_PORT:-6379}:6379
