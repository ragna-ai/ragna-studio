name: ragna_studio

volumes:
  postgres_data:
  redis_data:

services:
  migrate:
    image: ghcr.io/ragna-ai/ragna-studio-migrate:${RAGNA_VERSION:-latest}
    container_name: ragna_studio_migrate
    restart: 'no'
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: ghcr.io/ragna-ai/ragna-studio-migrate:${RAGNA_VERSION:-latest}
    container_name: ragna_studio_seed
    restart: 'no'
    command: ['node', 'dist/seed/index.mjs']
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ghcr.io/ragna-ai/ragna-studio-frontend:${RAGNA_VERSION:-latest}
    container_name: ragna_studio_frontend
    restart: always
    mem_limit: 512m
    cpus: 1.0
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:3010}
      NUXT_PUBLIC_MEDIA_URL: ${NUXT_PUBLIC_MEDIA_URL:-}
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net
    depends_on:
      - backend

  worker:
    image: ghcr.io/ragna-ai/ragna-studio-worker:${RAGNA_VERSION:-latest}
    container_name: ragna_studio_worker
    restart: always
    mem_limit: 2048m
    cpus: 2.0
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      seed:
        condition: service_completed_successfully

  backend:
    image: ghcr.io/ragna-ai/ragna-studio-backend:${RAGNA_VERSION:-latest}
    container_name: ragna_studio_backend
    restart: always
    mem_limit: 1024m
    cpus: 1.5
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      webbrowser:
        condition: service_started
      seed:
        condition: service_completed_successfully

  webbrowser:
    image: ghcr.io/ragna-ai/ragna-studio-webbrowser:${RAGNA_VERSION:-latest}
    container_name: ragna_studio_webbrowser
    restart: always
    mem_limit: 1536m
    cpus: 1.5
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-warn}
      BROWSER_NAVIGATION_TIMEOUT: ${BROWSER_NAVIGATION_TIMEOUT:-25000}
      BROWSER_BODY_LOAD_TIMEOUT: ${BROWSER_BODY_LOAD_TIMEOUT:-10000}
      BROWSER_MAX_CONCURRENCY: ${BROWSER_MAX_CONCURRENCY:-4}
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: ragna_studio_postgresql
    restart: always
    mem_limit: 1024m
    cpus: 1.5
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      # TCP check: during first-boot initdb Postgres only listens on the unix socket
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

  redis:
    image: redis:8.8.0-alpine3.23
    container_name: ragna_studio_redis
    restart: always
    mem_limit: 256m
    cpus: 0.5
    command: 'redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}'
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - app_net

networks:
  app_net:
    name: ragna_studio_network
    driver: bridge
